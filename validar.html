<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validar Entrada — Vila Seca Stand-Up Night</title>
<link rel="stylesheet" href="style.css">
<style>
.val-wrap { max-width:600px; margin:0 auto; padding:2.5rem 2rem; }
.val-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:2rem; padding-bottom:1.5rem; border-bottom:2px solid var(--ink); flex-wrap:wrap; gap:1rem; }
.val-top h2 { font-family:'Bebas Neue',cursive; font-size:2.2rem; line-height:1; }
.event-tag { font-family:'Space Mono',monospace; font-size:.62rem; color:var(--muted); letter-spacing:2px; margin-top:.3rem; }
.scan-zone { border:2px dashed var(--border); background:var(--cream); height:250px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:.5rem; cursor:pointer; transition:all .18s; }
.scan-zone:hover { border-color:var(--ink); background:#ede8dd; }
.sz-icon { font-size:3.5rem; }
.sz-text { font-family:'Space Mono',monospace; font-size:.65rem; letter-spacing:2px; color:var(--muted); text-transform:uppercase; }
#scanner-video { width:100%; height:250px; object-fit:cover; display:none; border:2px solid var(--ink); background:black; }
.scan-fb { margin-top:1rem; padding:1rem 1.2rem; display:none; border-radius:2px; }
.scan-fb.ok   { display:flex; background:#d4f5e2; border:1.5px solid var(--green); }
.scan-fb.fail { display:flex; background:#fde8e8; border:1.5px solid var(--red); }
.scan-fb.warn { display:flex; background:#fff3cd; border:1.5px solid #f0b400; }
.scan-fb.pend { display:flex; background:#fff0e0; border:1.5px solid var(--orange); }
.sf-icon   { font-size:1.8rem; margin-right:.8rem; flex-shrink:0; }
.sf-name   { font-weight:700; font-size:.95rem; }
.sf-detail { font-size:.78rem; color:#555; margin-top:.2rem; font-family:'Space Mono',monospace; }
.manual-row { display:flex; gap:.5rem; margin-top:1.5rem; }
.manual-row input { flex:1; padding:.75rem 1rem; border:1.5px solid var(--border); font-family:'Space Mono',monospace; font-size:.75rem; letter-spacing:3px; outline:none; }
.manual-row input:focus { border-color:var(--ink); }
.val-card { background:white; border:1.5px solid var(--border); padding:2rem; margin-bottom:1.5rem; }
.val-card h3 { font-family:'Bebas Neue',cursive; font-size:1.4rem; margin-bottom:1.5rem; }
.lookup-input { width:100%; padding:.75rem 1rem; border:1.5px solid var(--border); font-family:'Space Mono',monospace; font-size:.75rem; outline:none; box-sizing:border-box; }
.lookup-input:focus { border-color:var(--ink); }
.lookup-results { margin-top:1rem; }
.lookup-item { display:flex; align-items:center; justify-content:space-between; padding:.8rem 1rem; border:1.5px solid var(--border); margin-bottom:.5rem; gap:.8rem; flex-wrap:wrap; }
.lookup-item:hover { border-color:var(--ink); }
.li-info { flex:1; min-width:0; }
.li-name { font-weight:700; font-size:.9rem; }
.li-detail { font-family:'Space Mono',monospace; font-size:.65rem; color:var(--muted); margin-top:.2rem; word-break:break-all; }
.li-status { font-family:'Space Mono',monospace; font-size:.58rem; letter-spacing:1px; padding:.25rem .6rem; border-radius:2px; flex-shrink:0; }
.li-status.s-valid { background:#d4f5e2; color:var(--green); }
.li-status.s-presencial { background:#d4f5e2; color:var(--green); }
.li-status.s-pending { background:#fff0e0; color:var(--orange); }
.li-status.s-used { background:#f0f0f0; color:#888; }
.lookup-empty { text-align:center; padding:1.5rem; font-family:'Space Mono',monospace; font-size:.72rem; color:var(--muted); }
</style>
</head>
<body>

<div class="loading-overlay" id="loading"><div class="spinner"></div><div class="loading-text" id="loading-text">A carregar...</div></div>

<nav>
  <a class="nav-brand" href="index.html">
    <span class="nav-brand-top">Comissão de Festas</span>
    <span class="nav-brand-main">VILA SECA</span>
  </a>
  <div class="nav-links">
    <a class="nav-btn" href="admin.html">← Dashboard</a>
    <span class="nav-btn active" style="cursor:default">Validar Entrada</span>
  </div>
</nav>

<div class="val-wrap">
  <div class="val-top">
    <div>
      <h2>Validar Entrada</h2>
      <div class="event-tag">Stand-Up Comedy Night · Vila Seca · 14 Jun 2025</div>
    </div>
  </div>

  <div class="val-card">
    <h3>Scan QR Code</h3>
    <div id="scan-zone" class="scan-zone" onclick="toggleScanner()">
      <span class="sz-icon">📷</span>
      <span class="sz-text">Clica para ligar câmara</span>
    </div>
    <video id="scanner-video" playsinline autoplay></video>
    <canvas id="scanner-canvas" style="display:none"></canvas>
    <div id="scan-fb" class="scan-fb">
      <div class="sf-icon" id="sf-icon"></div>
      <div><div class="sf-name" id="sf-name"></div><div class="sf-detail" id="sf-detail"></div></div>
    </div>
    <div style="margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--border)">
      <div style="font-family:'Space Mono',monospace;font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem">Validação Manual por Código</div>
      <div class="manual-row">
        <input type="text" id="m-code" placeholder="TC-XXXXXX" onkeydown="if(event.key==='Enter')doManual()">
        <button class="abtn green" onclick="doManual()">Validar</button>
      </div>
    </div>
  </div>

  <div class="val-card">
    <h3>Procurar Bilhete</h3>
    <input type="text" class="lookup-input" id="lu-input" placeholder="Pesquisar por nome, email ou telemóvel..." oninput="doLookup()">
    <div class="lookup-results" id="lu-results"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
/* ---- GUARD: só com sessão admin ---- */
if(!restoreAdminSession()){
  window.location.href = 'admin.html';
}

/* ---- SCANNER ---- */
var scanning=false, scanStream=null;

async function toggleScanner(){
  if(scanning){ stopScanner(); return; }
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    var v = document.getElementById('scanner-video');
    v.srcObject = scanStream; v.style.display = 'block';
    document.getElementById('scan-zone').style.display = 'none';
    scanning = true;
    if(!window.jsQR){
      toast('Scanner indisponível — usa validação manual','warn');
    } else {
      requestAnimationFrame(doFrame);
    }
    toast('Câmara ligada — aponta para o QR Code');
  } catch(e){ toast('Não foi possível aceder à câmara','err'); }
}

function stopScanner(){
  scanning = false;
  if(scanStream){ scanStream.getTracks().forEach(function(t){t.stop();}); scanStream=null; }
  var v = document.getElementById('scanner-video');
  if(v){ v.style.display='none'; v.srcObject=null; }
  var sz = document.getElementById('scan-zone');
  if(sz) sz.style.display = 'flex';
}

var _frameCount = 0;
function doFrame(){
  if(!scanning) return;
  var v=document.getElementById('scanner-video'), c=document.getElementById('scanner-canvas');
  _frameCount++;
  if(v&&v.readyState===v.HAVE_ENOUGH_DATA&&c&&window.jsQR){
    c.width=v.videoWidth; c.height=v.videoHeight;
    var ctx=c.getContext('2d'); ctx.drawImage(v,0,0);
    var img=ctx.getImageData(0,0,c.width,c.height);
    if(_frameCount % 60 === 0) console.log('Scanning frame', _frameCount, 'video:', v.videoWidth+'x'+v.videoHeight);
    var qr=window.jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
    if(qr){
      console.log('QR detected:', qr.data);
      validateCode(qr.data); stopScanner(); return;
    }
  } else if(_frameCount % 60 === 0){
    console.log('Waiting... readyState:', v?v.readyState:'no-video', 'jsQR:', !!window.jsQR);
  }
  requestAnimationFrame(doFrame);
}

async function validateCode(raw){
  var code = raw.trim();
  try{ var p=JSON.parse(raw); if(p.code) code=p.code; }catch(e){}
  // Extrair código de URLs (ex: bilhete.html?codigo=TC-xxx)
  try {
    var urlMatch = code.match(/[?&]codigo=([^&]+)/);
    if(urlMatch) code = decodeURIComponent(urlMatch[1]);
  } catch(e){}
  var fb = document.getElementById('scan-fb');
  fb.className = 'scan-fb'; fb.style.display = 'flex';
  setEl('sf-icon','⌛'); setEl('sf-name','A verificar...'); setEl('sf-detail','');
  try {
    var t = await getTicketByCode(code);
    if(!t){
      fb.classList.add('fail');
      setEl('sf-icon','✗'); setEl('sf-name','Bilhete Inválido');
      setEl('sf-detail','Código não encontrado: '+code);
      toast('Bilhete inválido','err');
    } else if(t.status==='pending'){
      fb.classList.add('pend');
      setEl('sf-icon','⏳'); setEl('sf-name',t.name);
      setEl('sf-detail','PAGAMENTO NÃO CONFIRMADO — Confirma no painel admin primeiro!');
      toast('Pagamento não confirmado!','warn');
    } else if(t.status==='used'){
      fb.classList.add('warn');
      setEl('sf-icon','⚠'); setEl('sf-name',t.name);
      setEl('sf-detail','BILHETE JÁ UTILIZADO — Entrada recusada!');
      toast('Bilhete já utilizado!','err');
    } else {
      fb.classList.add('ok');
      setEl('sf-icon','✓'); setEl('sf-name',t.name);
      setEl('sf-detail',t.qty+' bilhete(s) · Entrada autorizada!');
      await updateTicket(code, {status:'used'});
      toast('Entrada autorizada: '+t.name,'ok');
    }
  } catch(e){
    fb.classList.add('fail');
    setEl('sf-icon','⚠'); setEl('sf-name','Erro de ligação');
    setEl('sf-detail','Verifica a ligação à internet');
    toast('Erro de ligação','err');
  }
}

function doManual(){
  var c = document.getElementById('m-code').value.trim();
  if(!c){ toast('Introduz um código','err'); return; }
  validateCode(c);
  document.getElementById('m-code').value = '';
}

/* ---- PESQUISA DE BILHETES ---- */
var _luTickets = [];
var _luLoaded = false;

async function loadLookupData(){
  if(_luLoaded) return;
  try {
    _luTickets = await getTickets();
    _luLoaded = true;
  } catch(e){ toast('Erro ao carregar bilhetes','err'); }
}

function doLookup(){
  var q = document.getElementById('lu-input').value.trim().toLowerCase();
  var box = document.getElementById('lu-results');
  if(!q || q.length < 2){ box.innerHTML = ''; return; }
  if(!_luLoaded){ loadLookupData().then(function(){ doLookup(); }); return; }
  var results = _luTickets.filter(function(t){
    return t.name.toLowerCase().indexOf(q)!==-1 ||
           t.email.toLowerCase().indexOf(q)!==-1 ||
           (t.phone && t.phone.replace(/\s/g,'').indexOf(q.replace(/\s/g,''))!==-1) ||
           t.code.toLowerCase().indexOf(q)!==-1;
  });
  if(!results.length){
    box.innerHTML = '<div class="lookup-empty">Nenhum bilhete encontrado</div>';
    return;
  }
  box.innerHTML = results.map(function(t){
    var statusLabel = t.status==='valid'?'CONFIRMADO':t.status==='used'?'USADO':t.status==='presencial'?'PRESENCIAL':'PENDENTE';
    var statusClass = 's-'+t.status;
    var canValidate = t.status==='valid'||t.status==='presencial';
    return '<div class="lookup-item">'+
      '<div class="li-info">'+
        '<div class="li-name">'+t.name+'</div>'+
        '<div class="li-detail">'+t.email+' · '+t.phone+' · '+t.code+'</div>'+
      '</div>'+
      '<span class="li-status '+statusClass+'">'+statusLabel+'</span>'+
      (canValidate ? '<button class="abtn green" onclick="validateFromLookup(\''+t.code+'\')">Validar Entrada</button>' : '')+
    '</div>';
  }).join('');
}

async function validateFromLookup(code){
  await validateCode(code);
  _luLoaded = false;
  loadLookupData().then(function(){ doLookup(); });
}

loadLookupData();
</script>
</body>
</html>
